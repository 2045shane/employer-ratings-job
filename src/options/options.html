<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雇主评分 · 设置</title><link rel="stylesheet" href="../ui/theme.css"><link rel="stylesheet" href="../ui/pages.css"></head><body><main><header><span class="seal">雇</span><h1>雇主评分 · 设置</h1></header><section class="card"><h2>自定义公司评分</h2><p>粘贴公司名到评分对象的 JSON，按规范化公司名覆盖内置数据；保存 {} 可清空覆盖。数据仅存于本机。</p><p class="muted">overall / workLife / compensation：1–5；recommendPct：0–100；source：来源；updated：YYYY-MM-DD。内置数据均为示例，非真实评分。</p><form id="ratings-form"><label for="json">自定义 JSON</label><textarea id="json" rows="16" spellcheck="false" style="box-sizing:border-box;width:100%;font:13px/1.6 monospace"></textarea><button class="primary">校验并保存评分</button></form><button id="sample" class="linkish">查看内置示例格式（填入编辑框，保存后生效）</button><p id="ratings-status" role="status"></p></section><section class="card"><h2>离线解锁</h2><p>每日免费查询 3 个职位，按本地日期重置。</p><p>免费次数已用完，解锁请小红书私信「珊哥爱读书」</p><form id="license-form"><label for="license">许可（ERJ1. 开头，留空可清除）</label><input id="license" autocomplete="off" spellcheck="false"><button class="primary">验证并保存许可</button></form><p id="license-status" role="status"></p></section><p class="muted">公开的离线校验只能用于 MVP，不具备防破解能力。未接入支付、联网验证或第三方评分抓取。</p></main><script src="options.js"></script></body></html>
